services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: hi-neo4j
    environment:
      # Authentication
      NEO4J_AUTH: neo4j/hi_password

      # Server configuration
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G

      # Database configuration
      NEO4J_server_default__database: knowledgegraph
      NEO4J_dbms_default__database: knowledgegraph

      # Security and networking
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474

      # Plugins and procedures
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: gds.*,apoc.*

      # APOC configuration
      NEO4J_server_config_strict__validation_enabled: false
      NEO4J_apoc_export_file_enabled: true
      NEO4J_apoc_import_file_enabled: true
      NEO4J_apoc_import_file_use__neo4j__config: true

      # Performance tuning
      NEO4J_server_db_query_cache_size: 256M
      NEO4J_server_db_tx_log_rotation_retention__policy: 3 days

    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - hi-network
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "hi_password",
          "MATCH () RETURN count(*) as count",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Go Backend API with Neo4j
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.neo4j
    container_name: hi-backend
    ports:
      - "8080:8080"
      - "9090:9090" # Metrics port
    environment:
      # Neo4j Configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: hi_password
      NEO4J_DATABASE: knowledgegraph
      NEO4J_MAX_CONNECTION_POOL_SIZE: 50
      NEO4J_CONNECTION_ACQUISITION_TIMEOUT: 60s

      # Application
      GIN_MODE: debug
      PORT: 8080
      APP_VERSION: dev
      APP_ENV: development

      # JWT
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRY_HOURS: 24

      # Redis
      REDIS_ENABLED: true
      REDIS_URL: redis://redis:6379

      # Features
      GRAPH_VISUALIZATIONS_ENABLED: true
      REAL_TIME_ENABLED: true
      SEARCH_ENABLED: true
      TAGGING_ENABLED: true

      # Performance
      QUERY_CACHE_ENABLED: true
      QUERY_CACHE_TTL: 300s

      # Monitoring
      METRICS_ENABLED: true
      METRICS_PORT: 9090

      # Development
      DEBUG_ENABLED: true
      SEED_DATABASE: true
      LOG_LEVEL: debug

    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
    networks:
      - hi-network
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    command: air -c .air.toml

  # SvelteKit Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.neo4j
    container_name: hi-frontend
    ports:
      - "3000:3000"
      - "3001:3001" # HMR port
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080
      - VITE_NEO4J_BROWSER_URL=http://localhost:7474

      # Feature flags
      - VITE_ENABLE_GRAPH_VISUALIZATIONS=true
      - VITE_ENABLE_REAL_TIME=true
      - VITE_ENABLE_ADVANCED_SEARCH=true
      - VITE_ENABLE_TAGGING=true

      # Graph visualization settings
      - VITE_MAX_GRAPH_NODES=1000
      - VITE_DEFAULT_GRAPH_LAYOUT=force
      - VITE_ENABLE_3D_GRAPH=false

      - HMR_PORT=3001
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
      - /app/.svelte-kit
    networks:
      - hi-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Grafana with Neo4j Dashboards (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: hi-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=neo4j-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hi-network
    depends_on:
      - neo4j
    restart: unless-stopped
    profiles:
      - monitoring
      - full

# Named volumes for persistent data
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  go_modules:
    driver: local
  node_modules:
    driver: local

# Networks
networks:
  hi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
# Profiles for different deployment scenarios
# Usage examples:
# docker-compose -f docker-compose.neo4j.yml up                    # Basic stack (neo4j, redis, backend, frontend)
# docker-compose -f docker-compose.neo4j.yml --profile monitoring up # With Grafana monitoring
# docker-compose -f docker-compose.neo4j.yml --profile full up    # Everything
