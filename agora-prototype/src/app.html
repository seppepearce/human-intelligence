<!DOCTYPE html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Agora Prototype Meta -->
		<meta name="description" content="Digital Agora - Where ancient wisdom meets modern discourse. Recreating the natural social dynamics of the Greek agora for meaningful online conversations." />
		<meta name="keywords" content="agora, discourse, philosophy, collaboration, ancient wisdom, digital forum, intellectual community" />
		<meta name="author" content="Human Intelligence Team" />

		<!-- Open Graph / Social Media -->
		<meta property="og:title" content="Digital Agora - Ancient Wisdom, Modern Tools" />
		<meta property="og:description" content="Experience discourse as the ancient Greeks intended - with natural constraints that enhance rather than limit conversation." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/agora-preview.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Digital Agora - Ancient Wisdom, Modern Tools" />
		<meta name="twitter:description" content="Where meaningful discourse thrives through natural social constraints." />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

		<!-- Agora Theme Colors -->
		<meta name="theme-color" content="#1a1a2e" />
		<meta name="msapplication-TileColor" content="#1a1a2e" />

		%sveltekit.head%

		<style>
			/* Agora Base Styles */
			:root {
				/* Ancient Greek inspired color palette */
				--agora-marble: #f8f9fa;
				--agora-stone: #e9ecef;
				--agora-shadow: #495057;
				--agora-night: #1a1a2e;
				--agora-deep: #16213e;
				--agora-gold: #d4af37;
				--agora-bronze: #cd7f32;
				--agora-crimson: #dc143c;
				--agora-olive: #808000;

				/* Modern accents */
				--agora-neon-cyan: #00f5ff;
				--agora-neon-purple: #8b5cf6;
				--agora-neon-pink: #ff006e;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: linear-gradient(135deg, var(--agora-night) 0%, var(--agora-deep) 100%);
				color: var(--agora-marble);
				min-height: 100vh;
				line-height: 1.6;
			}

			/* Agora Typography */
			h1, h2, h3, h4, h5, h6 {
				font-family: 'Crimson Text', Georgia, serif;
				font-weight: 600;
				color: var(--agora-gold);
				text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
			}

			/* Scrollbar Styling */
			::-webkit-scrollbar {
				width: 8px;
			}

			::-webkit-scrollbar-track {
				background: var(--agora-deep);
			}

			::-webkit-scrollbar-thumb {
				background: var(--agora-gold);
				border-radius: 4px;
			}

			::-webkit-scrollbar-thumb:hover {
				background: var(--agora-bronze);
			}

			/* Loading state */
			.agora-loading {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				background: var(--agora-night);
			}

			.agora-spinner {
				width: 40px;
				height: 40px;
				border: 3px solid var(--agora-deep);
				border-top: 3px solid var(--agora-gold);
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}

			/* Agora glow effects */
			.agora-glow {
				box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
			}

			.agora-glow:hover {
				box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
			}

			/* Accessibility */
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}

			/* Focus states */
			:focus-visible {
				outline: 2px solid var(--agora-gold);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="agora-app">
			<div id="agora-loading" class="agora-loading">
				<div class="agora-spinner"></div>
			</div>
			%sveltekit.body%
		</div>

		<script>
			// Hide loading spinner once app loads
			document.addEventListener('DOMContentLoaded', function() {
				const loading = document.getElementById('agora-loading');
				if (loading) {
					setTimeout(() => {
						loading.style.display = 'none';
					}, 100);
				}
			});
		</script>
	</body>
</html>
