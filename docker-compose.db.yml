services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hi-postgres-dev
    environment:
      POSTGRES_DB: human_intelligence
      POSTGRES_USER: hi_user
      POSTGRES_PASSWORD: hi_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - hi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hi_user -d human_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache (Optional - for development)
  redis:
    image: redis:7-alpine
    container_name: hi-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: hi-adminer-dev
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=dracula
    networks:
      - hi-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Networks
networks:
  hi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
